spring:
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: localhost
    port: 2525
    username: ""
    password: ""
    properties:
      mail:
        smtp:
          auth: "false"
          starttls:
            enable: "false"
        debug: "false"

app:
  verification:
    token-expiry-minutes: 30

  auth:
    access-token-expiry-minutes: 15
    refresh-token-expiry-days: 7
    jwt:
      secret: integration-test-auth-jwt-secret-key-at-least-32-chars
      issuer: vegalife-backend-integration
      audience: vegalife-api

  scheduling:
    enabled: false

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.testcontainers: INFO
    org.springframework.mail: DEBUG
server:
  port: ${SERVER_PORT:8080}

spring:
  # Bare local runs (no spring.profiles.active) activate dev, whose dummy-key
  # fallback keeps startup alive when HF_TOKEN is unset (#85). Explicitly
  # activated profiles — test, integration, prod — ignore this default.
  profiles:
    default: dev

  ai:
    openai:
      base-url: ${HF_BASE_URL:https://router.huggingface.co/v1}
      api-key: ${HF_TOKEN:}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vegalife}
    username: ${DB_USER:vegalife}
    password: ${DB_PASSWORD:vegalife}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    out-of-order: true

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false

app:
  auth:
    access-token-expiry-minutes: 15
    refresh-token-expiry-days: 7
    jwt:
      secret: ${AUTH_JWT_SECRET:dev-auth-jwt-secret-change-in-production}
      issuer: vegalife-backend
      audience: vegalife-api

  password-reset:
    otp-expiry-minutes: 10

  email-verification:
    otp-expiry-minutes: 10

  scheduling:
    enabled: true

  outbound:
    polling:
      interval: 5s
    retry:
      delays: [10s, 30s, 2m]
      deferred-delay: 5m
    visibility-timeout: 60s
    max-age: 24h
    retention: 7d
    batch-size: 10

  media:
    cloudinary:
      cloud-name: ${CLOUDINARY_CLOUD_NAME:}
      api-key: ${CLOUDINARY_API_KEY:}
      api-secret: ${CLOUDINARY_API_SECRET:}
    upload:
      grant-ttl: 15m
      max-image-bytes: 5242880
      max-video-bytes: 52428800
      allowed-image-types: [image/jpeg, image/png, image/webp]
      allowed-video-types: [video/mp4, video/webm]

  filter:
    accept-threshold: 0.65
    reject-threshold: 0.43
    sweep-max-age: 24h
    embedding:
      # Raw HF feature-extraction route, verified live (ADR-007); not the OpenAI-compat /v1 path.
      base-url: ${HF_EMBEDDING_BASE_URL:https://router.huggingface.co/hf-inference/models}
      model: ${HF_EMBEDDING_MODEL:intfloat/multilingual-e5-large-instruct}
      api-key: ${HF_TOKEN:}
      timeout: 30s

  payments:
    # Browser page the gateway redirects to after payment; frontend-owned, never an API path.
    return-url: ${PAYMENT_RETURN_URL:http://localhost:3000/payment/result}
    checkout-ttl: 30m
    # Gateway credentials and endpoint are profile-scoped on purpose: only
    # application-dev.yml ships the VNPay sandbox payment URL, so production must
    # supply VNPAY_PAYMENT_URL alongside the credentials itself.
    # Checkout fails fast while these are blank (FR-019); the IPN endpoint does not.

logging:
  level:
    com.vegalife: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
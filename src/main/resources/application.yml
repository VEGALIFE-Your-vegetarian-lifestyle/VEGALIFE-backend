server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vegalife}
    username: ${DB_USER:vegalife}
    password: ${DB_PASSWORD:vegalife}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false

app:
  verification:
    token-expiry-minutes: 30
    issuer: vegalife-backend
    secret: ${VERIFICATION_SECRET:dev-verification-secret-change-in-production}

  auth:
    access-token-expiry-minutes: 15
    refresh-token-expiry-days: 7
    jwt:
      secret: ${AUTH_JWT_SECRET:dev-auth-jwt-secret-change-in-production}
      issuer: vegalife-backend
      audience: vegalife-api

  password-reset:
    otp-expiry-minutes: 10

  email-verification:
    otp-expiry-minutes: 10

  scheduling:
    enabled: true

logging:
  level:
    com.vegalife: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
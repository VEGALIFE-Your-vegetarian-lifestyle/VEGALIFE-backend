server:
  # PORT first (Render injects it), then SERVER_PORT, then 8080. Declared here so
  # the key binds on every profile; application-prod.yml restates the same
  # precedence explicitly for the deployed case.
  port: ${PORT:${SERVER_PORT:8080}}

spring:
  # Bare local runs (no spring.profiles.active) activate dev, whose dummy-key
  # fallback keeps startup alive when AI_CHAT_API_KEY is unset (#85). Explicitly
  # activated profiles — test, integration, prod — ignore this default.
  profiles:
    default: dev

  ai:
    openai:
      # Dedicated chat env vars (BR-AI-005): chat traffic never shares embedding
      # credentials. ADR-014 decision 7 dropped the AI_CHAT_API_KEY -> HF_TOKEN
      # fallback: HuggingFace is no longer an embedding credential, so chaining it
      # here would send an embedding secret to the chat provider. base-url is the
      # host root only — Spring AI appends /v1/chat/completions itself.
      base-url: ${AI_CHAT_BASE_URL:https://api.openai.com}
      api-key: ${AI_CHAT_API_KEY:}
      chat:
        options:
          model: ${AI_CHAT_MODEL:gpt-4o-mini}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vegalife}
    username: ${DB_USER:vegalife}
    password: ${DB_PASSWORD:vegalife}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      # Flyway owns the schema. Exposed as an env key only so a local .env can
      # switch it deliberately; every profile either re-declares this literal or
      # overrides it (test: create-drop), and prod pins its own `none`.
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  flyway:
    # Env-exposed like ddl-auto: application-test.yml hard-sets this to false and
    # application-prod.yml is protected by the same explicit literal it had before.
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    locations: classpath:db/migration
    out-of-order: true

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          # Off in dev (a local Mailpit/MailHog catcher has no auth or TLS, and
          # JavaMail refuses to send when auth=true with no username); a real
          # relay overrides both. Declared here so the keys bind on every profile.
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false

app:
  auth:
    access-token-expiry-minutes: 15
    refresh-token-expiry-days: 7
    jwt:
      secret: ${AUTH_JWT_SECRET:dev-auth-jwt-secret-change-in-production}
      issuer: vegalife-backend
      audience: vegalife-api
    # Google sign-in (ADR-017). The client id/secret come from the Google Cloud
    # console; a blank pair makes the endpoint fail closed rather than boot-fail,
    # because password login must keep working on a deployment without it.
    google:
      token-url: https://oauth2.googleapis.com/token
      jwks-url: https://www.googleapis.com/oauth2/v3/certs
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      # Must be one of the redirect URIs registered for the client; blank omits
      # the parameter (Google requires it whenever more than one is registered).
      redirect-uri: ${GOOGLE_REDIRECT_URI:}
      issuer: https://accounts.google.com
      alternate-issuer: accounts.google.com
      clock-skew: 60s
      timeout: 10s
      jwks-cache-ttl: 6h

  password-reset:
    otp-expiry-minutes: 10

  email-verification:
    otp-expiry-minutes: 10

  scheduling:
    enabled: true

  outbound:
    polling:
      interval: 5s
    retry:
      delays: [10s, 30s, 2m]
      deferred-delay: 5m
    visibility-timeout: 60s
    max-age: 24h
    retention: 7d
    batch-size: 10

  media:
    cloudinary:
      cloud-name: ${CLOUDINARY_CLOUD_NAME:}
      api-key: ${CLOUDINARY_API_KEY:}
      api-secret: ${CLOUDINARY_API_SECRET:}
    upload:
      grant-ttl: 15m
      max-image-bytes: 5242880
      max-video-bytes: 52428800
      allowed-image-types: [image/jpeg, image/png, image/webp]
      allowed-video-types: [video/mp4, video/webm]

  # Sender address for SmtpEmailServiceImpl's applyFrom. Declared here rather than
  # only in application-prod.yml so MAIL_FROM binds on every profile; prod makes it
  # mandatory. Blank omits the From header instead of failing, which a local
  # catcher accepts but a real relay generally rejects.
  mail:
    from: ${MAIL_FROM:}

  filter:
    # Fallback for the content_filter_enabled platform setting. When filtering is on (the default),
    # a submitted post is queued for semantic filtering and is only published by the filter callback
    # if it passes. When off, it skips the filter and is parked directly in the admin review queue
    # (status=pending, flag=FILTER_SKIPPED) with no embedding call — intended for a deliberate
    # outage mode, not as the normal path (ADR-023, ADR-029).
    enabled: ${FILTER_ENABLED:true}
    # Calibrated for gemini-embedding-001 at 768 dims over the seed corpus; see
    # docs/feats/filter-calibration-gemini.md for the measured L/H separation and
    # why these values differ from the rule's pure output. Do not port these
    # numbers to another embedding model.
    accept-threshold: 0.70
    reject-threshold: 0.45
    sweep-max-age: 24h
    # Duplicate detection (issue #156, ADR-015): cosine similarity, not distance. Measured
    # against gemini-embedding-001 on real Vietnamese and English pairs; the bands are in
    # docs/feats/duplicate-post-detection.md. 0.85 is the lowest value with no false flags.
    duplicate-threshold: ${DUPLICATE_THRESHOLD:0.85}
    # Additive and switchable: false leaves the publish path exactly as it was before the feature.
    duplicate-enabled: ${DUPLICATE_DETECTION_ENABLED:true}
    embedding:
      # Which embedding client is active (ADR-014). 'gemini' is the default; 'hf' re-arms the
      # retained HuggingFace client, which is dormant because the account holds no Inference
      # Providers credits. An unrecognised value aborts startup.
      provider: ${EMBED_PROVIDER:gemini}
      gemini:
        base-url: ${EMBED_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
        model: ${EMBED_MODEL:gemini-embedding-001}
        api-key: ${EMBED_API_KEY:}
        # Must match the vector column order 5 creates, or inserts fail at runtime.
        dimensions: ${EMBED_DIMENSIONS:768}
        timeout: 30s
        batch-size: 100
      hf:
        # Dormant. Only read when provider=hf; never set these expecting the filter to use them.
        base-url: ${HF_EMBEDDING_BASE_URL:https://router.huggingface.co/hf-inference/models}
        model: ${HF_EMBEDDING_MODEL:intfloat/multilingual-e5-large-instruct}
        api-key: ${HF_TOKEN:}
        timeout: 30s

  payments:
    # Browser page the gateway redirects to after payment; frontend-owned, never an API path.
    return-url: ${PAYMENT_RETURN_URL:http://localhost:3000/payment/result}
    checkout-ttl: 30m
    # Gateway credentials and endpoint are declared in every profile so that the
    # same env keys (VNPAY_*) bind everywhere — a profile that ships real values
    # only overrides the defaults here. Fail-closed: blank credentials plus
    # enabled=false keep checkout answering 500 (FR-019) while the IPN webhook
    # stays reachable and acks 97 on a failed signature check (FR-020). dev turns
    # `enabled` on and supplies the sandbox endpoint; prod requires its own.
    vnpay:
      enabled: ${VNPAY_ENABLED:false}
      tmn-code: ${VNPAY_TMN_CODE:}
      secure-hash-secret: ${VNPAY_SECURE_HASH_SECRET:}
      payment-url: ${VNPAY_PAYMENT_URL:}
      locale: ${VNPAY_LOCALE:vn}

logging:
  level:
    # Env-exposed so a local .env can dial verbosity without editing YAML. The
    # defaults are the values this file shipped, so nothing changes unless set.
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.vegalife: ${LOGGING_LEVEL_COM_VEGALIFE:DEBUG}
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

springdoc:
  swagger-ui:
    # Swagger UI's tag index defaults to the order SpringDoc happens to register controllers in,
    # which reads as random. Alphabetical order comes from OpenApiTagOrderConfig; this sorts the
    # operations inside each tag by HTTP method, then by path.
    tags-sorter: alpha
    operations-sorter: method
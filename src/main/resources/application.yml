server:
  port: ${SERVER_PORT:8080}

spring:
  # Bare local runs (no spring.profiles.active) activate dev, whose dummy-key
  # fallback keeps startup alive when AI_CHAT_API_KEY is unset (#85). Explicitly
  # activated profiles — test, integration, prod — ignore this default.
  profiles:
    default: dev

  ai:
    openai:
      # Dedicated chat env vars (BR-AI-005): chat traffic never shares embedding
      # credentials. ADR-014 decision 7 dropped the AI_CHAT_API_KEY -> HF_TOKEN
      # fallback: HuggingFace is no longer an embedding credential, so chaining it
      # here would send an embedding secret to the chat provider. base-url is the
      # host root only — Spring AI appends /v1/chat/completions itself.
      base-url: ${AI_CHAT_BASE_URL:https://api.openai.com}
      api-key: ${AI_CHAT_API_KEY:}
      chat:
        options:
          model: ${AI_CHAT_MODEL:gpt-4o-mini}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vegalife}
    username: ${DB_USER:vegalife}
    password: ${DB_PASSWORD:vegalife}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    out-of-order: true

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false

app:
  auth:
    access-token-expiry-minutes: 15
    refresh-token-expiry-days: 7
    jwt:
      secret: ${AUTH_JWT_SECRET:dev-auth-jwt-secret-change-in-production}
      issuer: vegalife-backend
      audience: vegalife-api

  password-reset:
    otp-expiry-minutes: 10

  email-verification:
    otp-expiry-minutes: 10

  scheduling:
    enabled: true

  outbound:
    polling:
      interval: 5s
    retry:
      delays: [10s, 30s, 2m]
      deferred-delay: 5m
    visibility-timeout: 60s
    max-age: 24h
    retention: 7d
    batch-size: 10

  media:
    cloudinary:
      cloud-name: ${CLOUDINARY_CLOUD_NAME:}
      api-key: ${CLOUDINARY_API_KEY:}
      api-secret: ${CLOUDINARY_API_SECRET:}
    upload:
      grant-ttl: 15m
      max-image-bytes: 5242880
      max-video-bytes: 52428800
      allowed-image-types: [image/jpeg, image/png, image/webp]
      allowed-video-types: [video/mp4, video/webm]

  filter:
    # When false, a published post skips the semantic filter and lands directly in the admin review
    # queue (flag=NEEDS_REVIEW, status=unpublished) with no embedding call. Set true to re-enable.
    enabled: ${FILTER_ENABLED:false}
    # Calibrated for gemini-embedding-001 at 768 dims over the seed corpus; see
    # docs/feats/filter-calibration-gemini.md for the measured L/H separation and
    # why these values differ from the rule's pure output. Do not port these
    # numbers to another embedding model.
    accept-threshold: 0.70
    reject-threshold: 0.45
    sweep-max-age: 24h
    embedding:
      # Which embedding client is active (ADR-014). 'gemini' is the default; 'hf' re-arms the
      # retained HuggingFace client, which is dormant because the account holds no Inference
      # Providers credits. An unrecognised value aborts startup.
      provider: ${EMBED_PROVIDER:gemini}
      gemini:
        base-url: ${EMBED_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
        model: ${EMBED_MODEL:gemini-embedding-001}
        api-key: ${EMBED_API_KEY:}
        # Must match the vector column order 5 creates, or inserts fail at runtime.
        dimensions: ${EMBED_DIMENSIONS:768}
        timeout: 30s
        batch-size: 100
      hf:
        # Dormant. Only read when provider=hf; never set these expecting the filter to use them.
        base-url: ${HF_EMBEDDING_BASE_URL:https://router.huggingface.co/hf-inference/models}
        model: ${HF_EMBEDDING_MODEL:intfloat/multilingual-e5-large-instruct}
        api-key: ${HF_TOKEN:}
        timeout: 30s

  payments:
    # Browser page the gateway redirects to after payment; frontend-owned, never an API path.
    return-url: ${PAYMENT_RETURN_URL:http://localhost:3000/payment/result}
    checkout-ttl: 30m
    # Gateway credentials and endpoint are profile-scoped on purpose: only
    # application-dev.yml ships the VNPay sandbox payment URL, so production must
    # supply VNPAY_PAYMENT_URL alongside the credentials itself.
    # Checkout fails fast while these are blank (FR-019); the IPN endpoint does not.

logging:
  level:
    com.vegalife: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
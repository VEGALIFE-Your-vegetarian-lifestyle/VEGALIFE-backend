spring:
  config:
    activate:
      on-profile: dev

  ai:
    openai:
      # Spring AI refuses to start with an empty key; fall back to a dummy so
      # local dev works without HF_TOKEN. Real calls then fail at request time.
      api-key: ${HF_TOKEN:dev-dummy-key-not-a-secret}

  datasource:
    url: jdbc:postgresql://localhost:5432/vegalife
    username: vegalife
    password: vegalife

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          # Local catcher (Mailpit/MailHog) has no auth or TLS; JavaMail refuses to
          # send when auth=true but no username is set. Override for a real relay.
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

logging:
  level:
    com.vegalife: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
spring:
  config:
    activate:
      on-profile: dev
    # Local `.env` (gitignored, not baked into images) answers the environment
    # placeholders in this file and in application.yml. `optional:` keeps a missing
    # file a no-op, and config-data ranks below real OS variables, so a deploy
    # environment still wins. `[.properties]` is required because the filename has
    # no suffix Boot can infer; .env.example is written in properties syntax.
    import: optional:file:./.env[.properties]

  ai:
    openai:
      # Spring AI refuses to start with an empty key; fall back to a dummy so
      # local dev works without AI_CHAT_API_KEY (ADR-014 dropped the HF_TOKEN
      # fallback). Real calls then fail at request time.
      api-key: ${AI_CHAT_API_KEY:dev-dummy-key-not-a-secret}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vegalife}
    username: ${DB_USER:vegalife}
    password: ${DB_PASSWORD:vegalife}

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          # Local catcher (Mailpit/MailHog) has no auth or TLS; JavaMail refuses to
          # send when auth=true but no username is set. Override for a real relay.
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

logging:
  level:
    com.vegalife: ${LOGGING_LEVEL_COM_VEGALIFE:DEBUG}
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG

app:
  payments:
    vnpay:
      # Sandbox is the default for local runs; credentials come from the env and
      # stay blank until set, so checkout answers 500 (FR-019) rather than signing
      # with an empty secret. payment-url has no non-dev default; locale and
      # enabled default in application.yml and this only flips `enabled` on.
      enabled: ${VNPAY_ENABLED:true}
      tmn-code: ${VNPAY_TMN_CODE:}
      secure-hash-secret: ${VNPAY_SECURE_HASH_SECRET:}
      payment-url: ${VNPAY_PAYMENT_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}

spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false

  flyway:
    enabled: false

  mail:
    host: localhost
    port: ${greenmail.smtp.port:2525}
    username: test
    password: test
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  thymeleaf:
    cache: false

  security:
    enabled: false

app:
  auth:
    access-token-expiry-minutes: 15
    refresh-token-expiry-days: 7
    jwt:
      secret: test-auth-jwt-secret-key-at-least-32-chars
      issuer: vegalife-backend-test
      audience: vegalife-api

  scheduling:
    enabled: false

logging:
  level:
    com.vegalife: DEBUG
    org.springframework.test: DEBUG
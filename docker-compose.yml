services:
  postgres:
    image: postgres:16-alpine
    container_name: vegalife-postgres
    environment:
      POSTGRES_DB: vegalife
      POSTGRES_USER: ${DB_USER:-vegalife}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vegalife}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/main/resources/db/migration:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-vegalife} -d vegalife"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

volumes:
  postgres_data:
    driver: local
server:
  port: 8081

spring:
  application:
    name: vegalife-mcp-server
  ai:
    mcp:
      server:
        name: vegalife-menu-tools
        version: 0.0.1-SNAPSHOT
        # Streamable HTTP transport on Spring MVC; the MCP endpoint is /mcp
        # (spring.ai.mcp.server.streamable-http.mcp-endpoint default).
        protocol: STREAMABLE
        # The built-in ToolCallback converter drops the request _meta before the
        # tool call, so caller identity would never reach the tools
        # (spring-projects/spring-ai#4773). ToolSpecificationConfig registers
        # meta-merging specifications instead (ADR-012).
        tool-callback-converter: false

management:
  endpoints:
    web:
      exposure:
        include: health

# Base URL of the backend REST API the tools call (set per environment;
# the default targets a backend run on the host during local development).
backend:
  url: ${BACKEND_URL:http://localhost:8080}

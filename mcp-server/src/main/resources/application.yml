server:
  port: 8081

spring:
  application:
    name: vegalife-mcp-server
  ai:
    mcp:
      server:
        name: vegalife-menu-tools
        version: 0.0.1-SNAPSHOT
        # Streamable HTTP transport on Spring MVC; the MCP endpoint is /mcp
        # (spring.ai.mcp.server.streamable-http.mcp-endpoint default).
        protocol: STREAMABLE

management:
  endpoints:
    web:
      exposure:
        include: health

# Base URL of the backend REST API the tools call (set per environment;
# the default targets a backend run on the host during local development).
backend:
  url: ${BACKEND_URL:http://localhost:8080}
